<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lume — A curated dating app for intentional connections. Verified profiles, private chats, and meaningful matches." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ['Poppins', 'sans-serif'],
              body: ['"Work Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                DEFAULT: '#e11d48',
                soft: '#f43f5e',
                dark: '#be123c',
                tint: '#fff1f2',
              },
              ink: {
                DEFAULT: '#0f172a',
                soft: '#1e293b',
              },
              mist: '#f8fafc',
              line: '#e7eaf0',
            },
            boxShadow: {
              card: '0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05)',
              pop: '0 2px 6px rgba(15,23,42,0.06), 0 12px 28px rgba(15,23,42,0.1)',
            },
            borderRadius: {
              xl: '1rem',
              '2xl': '1.25rem',
              '3xl': '1.5rem',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.5s ease-out forwards',
              'slide-in-right': 'slideInRight 0.3s ease-out forwards',
              'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                from: { opacity: '0' },
                to: { opacity: '1' },
              },
              slideUp: {
                from: { opacity: '0', transform: 'translateY(16px)' },
                to: { opacity: '1', transform: 'translateY(0)' },
              },
              slideInRight: {
                from: { opacity: '0', transform: 'translateX(16px)' },
                to: { opacity: '1', transform: 'translateX(0)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.7' },
              },
            },
          },
        },
      };
    </script>

    <!-- Global Fonts & Component Styles -->
    <style type="text/tailwindcss">
      /* ========== BASE ========== */
      @layer base {
        body {
          @apply font-body text-ink bg-mist;
        }
        h1, h2, h3, h4, h5, h6 {
          @apply font-heading text-ink;
        }
      }

      /* ========== FOOTER ========== */
      @layer components {
        .site-footer {
          @apply bg-gray-900 text-gray-300;
        }
        .footer-newsletter {
          @apply bg-gray-800/60 border-b border-gray-700/40 py-8;
        }
        .footer-newsletter__row {
          @apply max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4;
        }
        .footer-newsletter__title {
          @apply text-base font-bold text-white tracking-tight;
        }
        .footer-newsletter__subtitle {
          @apply text-xs text-gray-400 mt-0.5;
        }
        .footer-newsletter__form {
          @apply flex gap-2 w-full md:w-auto;
        }
        .footer-newsletter__form input {
          @apply flex-1 md:w-56 px-4 py-2.5 rounded-full bg-gray-700/70 border border-gray-600/50 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500/30 transition-colors;
        }
        .footer-newsletter__form button {
          @apply px-5 py-2.5 rounded-full bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold transition-colors whitespace-nowrap;
        }
        .footer-main {
          @apply max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 grid grid-cols-1 lg:grid-cols-12 gap-10;
        }
        .footer-brand {
          @apply lg:col-span-4;
        }
        .footer-brand .logo {
          @apply flex items-center gap-2 text-xl font-extrabold text-white tracking-tight;
        }
        .footer-brand__desc {
          @apply text-xs text-gray-400 mt-3 leading-relaxed max-w-xs;
        }
        .footer-social {
          @apply flex gap-2 mt-5;
        }
        .footer-social .icon-btn {
          @apply w-8 h-8 rounded-full bg-gray-700/60 hover:bg-rose-600 text-gray-400 hover:text-white flex items-center justify-center transition-all duration-200;
        }
        .footer-columns {
          @apply lg:col-span-8 grid grid-cols-2 sm:grid-cols-4 gap-8;
        }
        .footer-col__title {
          @apply text-xs font-bold text-white uppercase tracking-wider mb-3;
        }
        .footer-col ul {
          @apply space-y-2;
        }
        .footer-link {
          @apply text-xs text-gray-400 hover:text-white transition-colors duration-200;
        }
        .footer-bottom {
          @apply max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 border-t border-gray-700/40 flex flex-col sm:flex-row items-center justify-between gap-3;
        }
        .footer-copy {
          @apply text-xs text-gray-500;
        }
        .footer-legal {
          @apply flex gap-4 text-xs text-gray-500;
        }
        .footer-legal a {
          @apply hover:text-white transition-colors;
        }

        /* ========== AUTH PAGES (Login / Signup / Forgot) ========== */
        .auth-wrapper {
          @apply min-h-screen flex items-center justify-center px-4 py-12 bg-[#f7f9fb];
        }
        .auth-card {
          @apply w-full max-w-md bg-white rounded-3xl border border-rose-100/60 shadow-[0_18px_40px_-18px_rgba(184,0,53,.28)] p-8 sm:p-10;
        }
        .auth-logo {
          @apply flex items-center gap-2 text-2xl font-extrabold text-gray-900 mb-6;
        }
        .auth-title {
          @apply text-2xl font-semibold text-gray-900 tracking-tight;
        }
        .auth-subtitle {
          @apply text-sm text-gray-500 mt-1.5 mb-6;
        }
        .auth-form {
          @apply space-y-5;
        }
        .input-group {
          @apply space-y-1.5;
        }
        .input-group label {
          @apply block text-xs font-semibold text-gray-700 tracking-wide;
        }
        .input-with-icon {
          @apply relative;
        }
        .input-icon {
          @apply absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none;
        }
        .input-with-icon input {
          @apply w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-500/10 transition-all;
        }
        .form-options {
          @apply flex items-center justify-between text-xs;
        }
        .checkbox-label {
          @apply flex items-center gap-2 text-gray-600 cursor-pointer;
        }
        .checkbox-label input[type="checkbox"] {
          @apply w-4 h-4 rounded border-gray-300 text-rose-600 focus:ring-rose-500;
        }
        .forgot-link {
          @apply text-rose-600 hover:text-rose-700 font-medium transition-colors;
        }
        .auth-btn {
          @apply w-full py-2.5 rounded-full text-white font-semibold text-sm bg-gradient-to-r from-[#8c0026] to-[#b80035] shadow-[0_12px_25px_-12px_rgba(184,0,53,.6)] transition-all duration-200 hover:shadow-[0_14px_30px_-12px_rgba(184,0,53,.75)] active:translate-y-0 inline-flex items-center justify-center gap-2;
        }
        .auth-footer-link {
          @apply text-center text-sm text-gray-500 mt-6;
        }
        .auth-footer-link a {
          @apply text-rose-600 font-semibold hover:text-rose-700 transition-colors;
        }

        /* ========== APP LAYOUT ========== */
        .app-shell {
          @apply max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8;
        }
        .page-title {
          @apply text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight font-heading;
        }
        .page-subtitle {
          @apply text-sm text-gray-500 mt-1;
        }
        .section-title {
          @apply text-lg font-bold text-gray-900 tracking-tight font-heading;
        }
        .card {
          @apply bg-white rounded-2xl border border-gray-100 shadow-sm;
        }
        .card-hover {
          @apply hover:shadow-md hover:-translate-y-0.5 transition-all duration-200;
        }
        .badge {
          @apply inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold;
        }
        .badge-rose {
          @apply bg-rose-50 text-rose-600 border border-rose-100;
        }
        .badge-emerald {
          @apply bg-emerald-50 text-emerald-600 border border-emerald-100;
        }
        .badge-gray {
          @apply bg-gray-100 text-gray-600;
        }
        .btn-primary {
          @apply px-5 py-2.5 rounded-full bg-gradient-to-r from-[#8c0026] to-[#b80035] hover:opacity-95 text-white font-semibold text-sm shadow-[0_12px_25px_-12px_rgba(184,0,53,.55)] transition-all duration-200 inline-flex items-center gap-2;
        }
        .btn-secondary {
          @apply px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold text-sm transition-all duration-200 inline-flex items-center gap-2;
        }
        .btn-ghost {
          @apply px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors;
        }
        .btn-outline {
          @apply px-5 py-2.5 rounded-full border border-gray-200 hover:border-rose-200 hover:bg-rose-50/40 text-gray-700 font-semibold text-sm transition-all duration-200 inline-flex items-center gap-2 bg-white;
        }
        .empty-state {
          @apply flex flex-col items-center justify-center py-16 px-6 text-center;
        }
        .empty-state-icon {
          @apply w-16 h-16 rounded-2xl bg-gray-100 text-gray-400 flex items-center justify-center mb-4;
        }
        .empty-state-title {
          @apply text-base font-bold text-gray-900 font-heading;
        }
        .empty-state-text {
          @apply text-sm text-gray-500 mt-1 max-w-xs;
        }
        .tab-bar {
          @apply flex gap-1 bg-gray-100 rounded-xl p-1;
        }
        .tab-item {
          @apply flex-1 py-2 px-3 rounded-lg text-sm font-semibold text-center transition-all duration-200 cursor-pointer;
        }
        .tab-active {
          @apply bg-white text-gray-900 shadow-sm;
        }
        .tab-inactive {
          @apply text-gray-500 hover:text-gray-700;
        }

        /* ========== MESSAGES ========== */
        .chat-bubble-them {
          @apply max-w-[80%] bg-gray-100 text-gray-800 p-3.5 rounded-2xl rounded-bl-md text-sm leading-relaxed;
        }
        .chat-bubble-me {
          @apply max-w-[80%] bg-gradient-to-r from-[#8c0026] to-[#b80035] text-white p-3.5 rounded-2xl rounded-br-md text-sm leading-relaxed ml-auto shadow-[0_10px_22px_-12px_rgba(184,0,53,.6)];
        }
        .chat-time {
          @apply text-[10px] mt-1 opacity-60;
        }
      }
    </style>

    <title>Lume — Dating App</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
